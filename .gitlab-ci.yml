include:
  - component: git-devops.opencsg.com/gitlab/ci-components/secret-detection@v1.4.8
  - component: git-devops.opencsg.com/gitlab/ci-components/test@v1.4.8
  - component: git-devops.opencsg.com/gitlab/ci-components/swagger@v1.4.8
    inputs:
      rules:
        - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      swag_command: |
        echo "docs.go last modified: $(stat -c "%y" docs/docs.go)"
        echo "docs/docs.go sha256: $(sha256sum docs/docs.go | cut -d" " -f1)"
        make swag
  - local: .gitlab/ci/*.yml

# A merge-forward conflict draft cannot be validated until the target branch
# has been merged into the source branch and conflicts have been resolved.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_DRAFT == "true" && $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME =~ /^dev-agent\/mf-/ && $CI_MERGE_REQUEST_TITLE =~ /^Draft: \[Merge-forward Conflict\]/'
      when: never
    - when: always

stages:
  - test
  - sync
  - swagger
  - build
  - deploy

variables:
  ## Git
  GIT_DEPTH: 1
  ## DCS
  CACHE_SHARED: "true"
  CACHE_COMPRESSION_LEVEL: "fast"
  FF_USE_FASTZIP: "true"
  # GIN
  GIN_MODE: "release"
