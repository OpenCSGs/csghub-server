# SaaS QA runs on the qa branch and follows the open milestone's release week: before
# the release-week Wednesday 18:00 CST only a scheduled pipeline deploys, from that
# point on pushes deploy. rules: cannot express the time, so both cadences create the
# jobs and .gitlab/ci/scripts/qa-release-gate.sh decides at runtime. The gate calls
# /pipelines/:id/cancel when it decides to skip, so the pipeline state is "canceled"
# (gray) instead of "failed" (red) and deploy never runs. Build has no allow_failure
# (default false), so a real build failure is red but deploy still does not run via
# when: on_success + needs. The build component derives the saas region flags from
# ${CI_COMMIT_TAG#*-}, which is empty on a branch pipeline, so CI_COMMIT_TAG is faked
# in rules below.
include:
  - component: git-devops.opencsg.com/gitlab/ci-components/sync-branch@v1.4.16
    inputs:
      source_branch: main
      target_branch: qa
      merge_mode: merge
      push_token: STARHUB_GROUP_CI_TOKEN
      custom_script:
        - export QA_GATE_ACTION=skip
        - . .gitlab/ci/scripts/qa-release-gate.sh
      custom_script_position: script_before
  - component: git-devops.opencsg.com/gitlab/ci-components/build@v1.4.10
    inputs:
      environment: qa
      edition: saas
      dockerfile: docker/Dockerfile-saas
      images:
        - "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        - "registry.opencsg.com/opencsg_public/starhub-server:$CI_COMMIT_TAG"
      custom_script:
        - . .gitlab/ci/scripts/qa-release-gate.sh
      custom_script_position: script_before
      build_args:
        - "CSGHUB_TAGS=$BUILD_EDITION"
        - "IMAGE_TAG=$CI_COMMIT_TAG"
        - "CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"
      rules:
        - if: $CI_COMMIT_BRANCH == "qa" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
          variables:
            CI_COMMIT_TAG: "${CI_COMMIT_SHORT_SHA}-cn-saas"

  # Deploys the tag the build just pushed, from the CI_COMMIT_TAG faked in rules below.
  # needs: ["build-qa-saas"] is required because v1.4.8 defaults needs to [], which
  # would start the deploy immediately, before the build pushes the image.
  - component: git-devops.opencsg.com/gitlab/ci-components/deploy@v1.4.10
    inputs:
      environment: qa
      edition: saas
      mode: helm
      ssa: true
      force_conflicts: true
      kubeconfig: KUBECONFIG_SAAS_QA
      needs: ["build-qa-saas"]
      chart_set:
        - 'image.tag="$CI_COMMIT_TAG"'
        - 'runner.image.tag="$CI_COMMIT_TAG"'
        - 'global.image.registry=registry.opencsg.com'
        - 'global.imageRegistry=registry.opencsg.com/opencsghq'
        - 'image.registry=registry.opencsg.com'
      rules:
        - if: $CI_COMMIT_BRANCH == "qa" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
          variables:
            CI_COMMIT_TAG: "${CI_COMMIT_SHORT_SHA}-cn-saas"
