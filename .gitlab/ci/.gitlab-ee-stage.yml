include:
  # EE prod: release tags, both architectures, external runner
  - component: git-devops.opencsg.com/gitlab/ci-components/build@v1.4.10
    inputs:
      environment: stage
      edition: ee
      dockerfile: docker/Dockerfile-ee
      proxy: http://172.21.1.212:7897
      no_proxy: "localhost,127.0.0.1,docker,${CI_REGISTRY},${CI_SERVER_HOST},registry.opencsg.com"
      images:
        - "registry.opencsg.com/opencsghq/csghub-server:$CI_COMMIT_TAG"
        - "docker.io/opencsghq/csghub-server:$CI_COMMIT_TAG"
      build_args:
        - "CSGHUB_TAGS=$BUILD_EDITION"
        - "IMAGE_TAG=$CI_COMMIT_TAG"
        - "CI_COMMIT_SHORT_SHA=$CI_COMMIT_SHORT_SHA"
      rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-ee$/'
          variables:
            PLATFORMS: "linux/amd64,linux/arm64"
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.\d+)?-ee(-(alpha|beta|rc)(\.\d+)?)?$/'
          variables:
            PLATFORMS: "linux/amd64"

  # EE deploy: any ee tag, release or pre-release. needs: ["build-stage-ee"] keeps
  # the deployment on stage ordering — v1.4.8 defaults needs to [], which would start
  # the deployment immediately and try to pull a tag the build has not pushed yet.
  - component: git-devops.opencsg.com/gitlab/ci-components/deploy@v1.4.10
    inputs:
      environment: stage
      edition: ee
      mode: helm
      kubeconfig: KUBECONFIG_EE
      needs: ["build-stage-ee"]
      chart_set:
        - 'image.tag="$CI_COMMIT_TAG"'
        - 'runner.image.tag="$CI_COMMIT_TAG"'
        - 'global.image.registry=registry.opencsg.com'
        - 'global.imageRegistry=registry.opencsg.com/opencsghq'
        - 'image.registry=registry.opencsg.com'
      rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.\d+)?-ee(-(alpha|beta|rc)(\.\d+)?)?$/'

  # Trigger the api-docs project to rebuild against this tag. allow_failure so a
  # docs rebuild failure does not block the EE release. IS_PRERELEASE is set in
  # rules.variables and expanded by envsubst in trigger_variables.
  - component: git-devops.opencsg.com/gitlab/ci-components/deploy@v1.4.13
    inputs:
      environment: api-docs
      edition: ee
      mode: cicd_trigger
      allow_failure: true
      trigger_token: STARHUB_DEPLOY_API_DOCS_TRIGGER_TOKEN
      trigger_project: "462"
      trigger_ref: main
      trigger_variables:
        - "TARGET_TAG=$CI_COMMIT_TAG"
        - "IS_PRERELEASE=$IS_PRERELEASE"
      rules:
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-ee$/'
          variables:
            IS_PRERELEASE: "0"
        - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(\.\d+)?-ee(-(alpha|beta|rc)(\.\d+)?)?$/'
          variables:
            IS_PRERELEASE: "1"
