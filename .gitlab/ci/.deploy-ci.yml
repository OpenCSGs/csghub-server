## Deploy to Staging ###################################
.deploy:
  image: ${ALI_ACR_REGISTRY}/alpine:latest
  stage: deploy
  needs:
    - "build-stage-saas"
  before_script:
    - sed -i 's/dl-cdn.alpinelinux.org/mirrors.aliyun.com/g' /etc/apk/repositories
    - apk add --no-cache curl
  script:
    - |
      curl --fail-with-body \
        --request POST \
        --form "token=${STARHUB_DEPLOY_TRIGGER_TOKEN}" \
        --form ref=main \
        --form "variables[starhub_tag]=${IMAGE_TAG}" \
        --form "variables[ENV_NAME]=$STG" \
        https://git-devops.opencsg.com/api/v4/projects/58/trigger/pipeline
  rules:
    - if: $CI_PIPELINE_SOURCE != "schedule" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

