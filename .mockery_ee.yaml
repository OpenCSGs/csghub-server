        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      LfsComponent:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      SandboxComponent:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      GatewayMCPServerComponent:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      AgentUserPreferenceComponent:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      AgentInstanceComponent:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      AgentSchedulerComponent:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      AgentCredentialComponent:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      LLMWikiManagementAccessComponent:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
  opencsg.com/csghub-server/aigateway/component:
    interfaces:
      SandboxComponent:
        config:
          mock-build-tags: "ee || saas"
          filename: "mock_{{.InterfaceName}}.go"
      GuestLogicalShareComponent:
        config:
          mock-build-tags: "ee || saas"
          filename: "mock_{{.InterfaceName}}.go"
      MCPGatewayComponent:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
  opencsg.com/csghub-server/aigateway/component/metrics:
    interfaces:
      MetricsSink:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
  opencsg.com/csghub-server/builder/mcp:
    interfaces:
      Client:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      BackendSession:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
      Gateway:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
  opencsg.com/csghub-server/builder/deploy:
    interfaces:
      Deployer:
        config:
          mock-build-tags: "ee"
          filename: "mock_{{.InterfaceName}}_ee.go"
          replace-type:
